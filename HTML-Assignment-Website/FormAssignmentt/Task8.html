<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 8</title>
  </head>
  <body>
    <form action="#" method="post">
      <h2>Farewell Party Survey Form</h2>

      <label for="name">Name</label><br />
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your name"
      /><br /><br />

      <label for="email">Email</label><br />
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
      /><br /><br />

      <label for="age">Age</label><br />
      <input type="number" id="age" name="age" placeholder="Enter your age" />
      <br /><br />

      <label>Which option best describes you?</label>

      <select id="student" name="student">
        <option value="1">student</option>
        <option value="2">student</option>
        <option value="3">student</option>
      </select>
      <br />
      <label>What did you like about the program?</label><br />
      <input type="checkbox" id="training" name="likes" value="Training" />
      <label for="training">Training</label><br />
      <input
        type="checkbox"
        id="sessions"
        name="likes"
        value="The Learning Sessions from Industry Experts"
      />
      <label for="sessions">The Learning Sessions from Industry Experts</label
      ><br />
      <input
        type="checkbox"
        id="meetups"
        name="likes"
        value="Community Meetups"
      />
      <label for="meetups">Community Meetups</label><br />
      <input
        type="checkbox"
        id="brownbag"
        name="likes"
        value="Brown Bag Sessions"
      />
      <label for="brownbag">Brown Bag Sessions</label><br />
      <input
        type="checkbox"
        id="hybrid"
        name="likes"
        value="Switching to Hybrid Mode"
      />
      <label for="hybrid">Switching to Hybrid Mode</label><br />
      <input type="checkbox" id="food" name="likes" value="Food, Office etc." />
      <label for="food">Food, Office etc.</label><br /><br />

      <label for="comments">Any comments or suggestions</label><br />
      <textarea id="comments" name="comments" rows="4" cols="50"></textarea
      ><br /><br />

      <input type="reset" value="Reset" />
      <input type="submit" value="Submit" />
    </form>

    <hr />

    <p><a href="./subIndex.html">Go Back</a></p>
    <br />
    <p><a href="../index.html">Go to Home</a></p>
  </body>
</html>
