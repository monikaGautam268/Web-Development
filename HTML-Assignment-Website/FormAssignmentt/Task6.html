<h3>Task 6</h3>
<h3>Registration Form : Dance Club</h3>

<form>
<table border="1">

<tr>
<td>Name:</td>
<td colspan="3"><input type="text" size="50"></td>
</tr>

<tr>
<td>IC No:</td>
<td><input type="text" size="5"></td>
<td><input type="text" size="5"></td>
<td><input type="text" size="5"></td>
</tr>

<tr>
<td>Address:</td>
<td colspan="3">
<textarea rows="4" cols="50"></textarea>
</td>
</tr>

<tr>
<td>Gender:</td>
<td colspan="3">
<input type="radio" name="g"> Male
<input type="radio" name="g"> Female
</td>
</tr>

<tr>
<td>Dance Type:</td>
<td colspan="3">
<input type="checkbox"> Zapin
<input type="checkbox"> Joget
<input type="checkbox"> Inang
<input type="checkbox"> Lion Dance
</td>
</tr>

<tr>
<td>Competition:</td>
<td colspan="3">
<select size="3">
<option>State Level</option>
<option>National Level</option>
<option>StateInternational Level</option>
</select>
</td>
</tr>

<tr>
<td>Nationality:</td>
<td colspan="3">
<select>
<option>-please select-</option>
<option>Indian</option>
<option>Other</option>
</select>
</td>
</tr>

<tr>
<td>Password:</td>
<td colspan="3">
<input type="password" size="30">
</td>
</tr>

<tr>
<td colspan="4">
<input type="submit" value="Register Me">
<input type="reset" value="Cancel">
</td>
</tr>

</table>
</form>

</body>
