<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div
      class="main-container d-flex justify-content-center align-content-center"
    >
      <div class="calculator rounded-5 border shadow w-25 h-auto mt-auto p-2">
        <div
          class="answer rounded-top-5  shadow-lg h-auto mt-auto w-100 bg-success-subtle  p-5 "
        ></div>
        <div
          class="operator rounded-bottom-5  shadow h-auto mt-auto  bg-danger-subtle p-2 "
        >
          <button class="bg-white border shadow-lg rounded-circle">AC</button>
          <button class="bg-white border rounded-circle shadow-lg">C</button>
          <button class="bg-white border rounded-circle shadow-lg">%</button>
          <button class="bg-white border rounded-circle shadow-lg">/</button>
          <button class="bg-white border rounded-circle shadow-lg">7</button>
          <button class="bg-white border rounded-circle shadow-lg">8</button>
          <button class="bg-white border rounded-circle shadow-lg">9</button>
          <button class="bg-white border rounded-circle shadow-lg">*</button>
          <button class="bg-white border rounded-circle shadow-lg">4</button>
          <button class="bg-white border rounded-circle shadow-lg">5</button>
          <button class="bg-white border rounded-circle shadow-lg">6</button>
          <button class="bg-white border rounded-circle shadow-lg">-</button>
          <button class="bg-white border rounded-circle shadow-lg">1</button>
          <button class="bg-white border rounded-circle shadow-lg">2</button>
          <button class="bg-white border rounded-circle shadow-lg">3</button>
          <button class="bg-white border rounded-circle shadow-lg">+</button>

          <div></div>
        </div>
      </div>
    </div>

    <!-- script -->
    <script src="./script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
